services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
      - BROWSER=none
      - CHOKIDAR_USEPOLLING=true
    command: ["sh", "-ec", "yarn install --frozen-lockfile --non-interactive && cd excalidraw-app && exec npx vite --host 0.0.0.0 --port 3001 --strictPort"]
    ports:
      - "3000:3001"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/ >/dev/null || (echo 'vite not responding'; exit 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 600s
    labels:
      base44.project: excalidraw-app
      base44.kind: web
      base44.port: "3000"
volumes:
  node_modules:
