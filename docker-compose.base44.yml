services:
  web:
    image: node:20
    working_dir: /app
    command: ["sh", "-ec", "yarn install --frozen-lockfile --network-timeout 600000 && cd excalidraw-app && exec npx vite --host 0.0.0.0 --port 3001"]
    ports: ["3000:3001"]
    environment:
      - BROWSER=none
      - CHOKIDAR_USEPOLLING=true
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 600s
    labels:
      base44.project: excalidraw-app
      base44.kind: web
      base44.port: "3000"

volumes:
  node_modules:
