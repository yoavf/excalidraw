services:
  excalidraw:
    image: node:24
    container_name: excalidraw-dev
    working_dir: /opt/node_app
    ports:
      - "3000:3000"
    restart: on-failure
    environment:
      - NODE_ENV=development
      # Vite dev server host allowlist (platform-managed)
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - ./:/opt/node_app
      - node_modules:/opt/node_app/node_modules
    command:
      [
        "sh",
        "-ec",
        "yarn --frozen-lockfile --network-timeout 600000 && cd excalidraw-app && exec yarn vite --host 0.0.0.0 --port 3000",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e 'fetch(\"http://localhost:3000/\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  node_modules:
