services:
  web:
    image: node:22
    working_dir: /app
    labels:
      base44.project: excalidraw-app
      base44.kind: web
      base44.port: "3000"
    command:
      - sh
      - -ec
      - yarn install --frozen-lockfile --non-interactive && cd excalidraw-app && exec npx vite --host 0.0.0.0 --port 3000 --strictPort
    environment:
      - BROWSER=none
      - CHOKIDAR_USEPOLLING=true
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 600s

volumes:
  node_modules:
